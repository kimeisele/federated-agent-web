[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-agent-web"
version = "0.2.0"
description = "Federated Agent Web — transport-agnostic delegation contract reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=41,<47",
    "jsonschema>=4.18,<5",
    "rfc8785==0.1.4",
]

[project.scripts]
faw = "federated_agent_web.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/federated_agent_web"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "federated_agent_web/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
